name: build-ipa

# 竖滑 feed（cedanmisquith/Tik-Tok-Video-Feed-Swift）接本地视频库，出未签名 ipa
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          xcodebuild -version
          sw_vers

      - name: 编译（未签名）
        run: |
          xcodebuild \
            -project "TikTok Video Feed Swift.xcodeproj" \
            -target "TikTok Video Feed Swift" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            OBJROOT="$PWD/build/obj" \
            SYMROOT="$PWD/build/sym" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

          APP=$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没有 .app 产物"
            tail -80 build.log
            exit 1
          fi
          echo "APP=$APP"

      - name: 失败保日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 打 ipa
        run: |
          APP=$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry TikTokFeed-unsigned.ipa Payload
          ls -lh TikTokFeed-unsigned.ipa

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: TikTokFeed-unsigned-ipa
          path: out/TikTokFeed-unsigned.ipa
          retention-days: 30
